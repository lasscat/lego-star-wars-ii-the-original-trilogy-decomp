name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  lint:
    name: Linting/style checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          check-latest: true

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Check source policy across the whole change
        env:
          SOURCE_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$SOURCE_POLICY_BASE"
          if [[ "$base" =~ ^0+$ ]]; then
            base=$(git hash-object -w -t tree /dev/null)
          fi
          python tools/check_source_policy.py --base "$base"

      - name: Test source-policy guard
        run: python -m unittest discover -s tools/tests -p 'test_source_policy.py'

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit/
          # Invalidate the cache if the pre-commit config changes or the Python version changes
          key: pre-commit-cache|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit checks
        run: pre-commit run --all-files --verbose

      - name: Check that sources are ASCII
        run: |
          if grep -rnP '[^\x00-\x7F]' src include tools/probes; then
            echo "Non-ASCII characters found (sjiswrap reads sources as Shift-JIS)"; exit 1
          fi
